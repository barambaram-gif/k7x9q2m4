<style>
@font-face{font-family:'Saira';font-weight:400;font-display:swap;src:url(fonts/saira-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Saira';font-weight:500;font-display:swap;src:url(fonts/saira-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Saira';font-weight:600;font-display:swap;src:url(fonts/saira-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Saira';font-weight:700;font-display:swap;src:url(fonts/saira-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Saira Condensed';font-weight:400;font-display:swap;src:url(fonts/saira-condensed-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Saira Condensed';font-weight:500;font-display:swap;src:url(fonts/saira-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Saira Condensed';font-weight:600;font-display:swap;src:url(fonts/saira-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Saira Condensed';font-weight:700;font-display:swap;src:url(fonts/saira-condensed-latin-700-normal.woff2) format('woff2')}
:root{--bg:#F6F6F2;--panel:#FFFFFF;--line:#DEDED6;--line2:#BDBDB3;--tx:#0B0B0C;--tx2:#2B2B2E;--mut:#5C5C62;--am:#FFB224;--ams:#C77F00;--amt:#8F5C00;--ink:#1A1200;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);line-height:1.4;font-family:'Saira',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 24px) 24px 32px}
.cd{font-family:'Saira Condensed','Saira',sans-serif}
a{color:var(--amt);text-decoration:none;font-weight:600}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--amt);outline-offset:2px}
.mut{color:var(--mut)}
.small{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center}
.sp{justify-content:space-between}
h1{margin:0 0 4px;font-family:'Saira Condensed',sans-serif;font-size:36px;font-weight:700;line-height:1.05}
h2{margin:0;font-family:'Saira Condensed',sans-serif;font-size:24px;font-weight:600}
.hr{border-top:1px solid var(--line);margin:28px 0}
.sec{margin-top:28px}
.btn{height:48px;padding:0 18px;border-radius:12px;border:none;background:var(--am);color:var(--ink);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--tx);font-weight:500}
.btn.sm{height:44px;font-size:14px;padding:0 14px}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:transparent;color:var(--tx);font-size:14px}
.pill.on{border-color:var(--ams);color:var(--amt);background:#FFF4DC;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.lbl{font-size:12px;color:var(--mut)}
#tabs{height:calc(84px + var(--sab) - 24px);padding:8px 8px var(--sab);display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);background:#fff;flex:none}
#tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mut);min-width:60px;min-height:48px;justify-content:center}
#tabs button.on{color:var(--amt);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translateX(-50%);background:#0B0B0C;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center;z-index:9}
#toast.on{opacity:1}
.blk{border-top:1px solid var(--line);padding:22px 0}
.blk button.ex{width:100%;text-align:left;background:none;border:none;padding:10px 0;display:flex;justify-content:space-between;align-items:center;min-height:60px;color:var(--tx)}
.ex .n{font-size:17px;font-weight:600}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line2)}
.dots i.d{background:var(--ams)}
.tl{position:relative;display:flex;flex-direction:column}
.tl:before{content:"";position:absolute;left:15px;top:20px;bottom:20px;width:2px;background:var(--line)}
.st{display:flex;align-items:center;gap:16px;min-height:60px;position:relative}
.dot{width:32px;height:32px;border-radius:16px;border:2px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--mut);flex:none}
.dot.d{background:var(--am);border-color:var(--ams)}
.dot.c{border-color:var(--ams);color:var(--amt);font-weight:700;background:#FFF4DC}
.in{width:64px;height:48px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--tx);font-family:'Saira Condensed',sans-serif;font-size:28px;font-weight:600;text-align:center}
.sel{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);font-size:16px;padding:0 12px}
.ring{position:relative;width:176px;height:176px}
.ring svg{position:absolute;inset:0}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mini{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:calc(-1 * var(--sat)) -24px 8px;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.meal{border-top:1px solid var(--line);padding:16px 0}
.meal summary{list-style:none;min-height:48px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.meal summary::-webkit-details-marker{display:none}
.food{display:flex;justify-content:space-between;font-size:14px;color:var(--tx2);padding:5px 0}
.bar{height:6px;border-radius:3px;background:var(--line)}
.bar>i{display:block;height:6px;border-radius:3px;background:var(--ams)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.modal>div{background:var(--panel);width:100%;border-radius:20px 20px 0 0;padding:20px 24px calc(24px + var(--sab));max-height:80%;overflow:auto}
</style>
</head>

function deloadCheck(){

  const withR=ss.filter(x=>(x.exercises||[]).some(e=>(e.sets||[]).some(t=>t.rir!==undefined&&t.rir!==null&&t.rir!=='')));
  const low=withR.filter(x=>{const r=[];(x.exercises||[]).forEach(e=>(e.sets||[]).forEach(t=>{if(t.rir!==undefined&&t.rir!==null&&t.rir!=='')r.push(Number(t.rir));}));return r.reduce((a,b)=>a+b,0)/r.length<=c.rirMax;}).length;

function lineChart(pts,opt){
  const w=opt.w||228,h=opt.h||64,p=8;if(!pts.length)return '';
  const ys=pts.map(q=>q.y),mn=Math.min(...ys),mx=Math.max(...ys),rg=(mx-mn)||1;
  const X=i=>pts.length===1?w/2:p+i*(w-2*p)/(pts.length-1),Y=v=>h-p-(v-mn)/rg*(h-2*p);
  let s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(opt.label||'Grafico')+'" style="display:block;max-width:100%">';
  if(opt.raw){opt.raw.forEach(q=>{s+='<circle cx="'+q.x*(w-2*p)/Math.max(1,opt.rawN-1)+'" cy="'+Y(q.y)+'" r="2.5" fill="#B9B9B0"/>';});}
  if(pts.length>1)s+='<polyline points="'+pts.map((q,i)=>X(i).toFixed(1)+','+Y(q.y).toFixed(1)).join(' ')+'" fill="none" stroke="#C77F00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((q,i)=>{const last=i===pts.length-1;s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(q.y).toFixed(1)+'" r="'+(last?5:3.5)+'" fill="'+(last?'#C77F00':'#F6F6F2')+'" stroke="#C77F00" stroke-width="2"/>';});
  return s+'</svg>';
}

function nextEx(id){

    if(d(a)<n)return a;if(d(b)<n)return b;
  }else if(d(id)<n)return id;
  for(let bi=L.bi+1;bi<P.b.length;bi++){const bb=P.b[bi];for(const x of bb.e){if(d(x)<rounds(bb))return x;}}

}

    document.querySelectorAll('[data-rl]').forEach(n=>n.textContent=rem?(U.rest.label||'Recupero'):'Pronto, vai alla prossima serie');

  if(!reps||(!noKg&&isNaN(kg))){toast(e.time?'Inserisci i secondi':(e.bw?'Inserisci le ripetizioni':'Inserisci peso e ripetizioni'));return;}
  const rirEl=document.getElementById('rir'),st={weight:kg||0,reps:reps};if(rirEl&&rirEl.value!=='')st.rir=parseInt(rirEl.value);
  (S.cur.ex[id]=S.cur.ex[id]||[]).push(st);save();
  const L=locate(id),n=rounds(L.b),nx=nextEx(id);
  if(L.b.e.length===2&&L.i===0&&(S.cur.ex[L.b.e[1]]||[]).length<n)startRest(TRANS,'Passa a '+EX[rx(L.b.e[1])].n);
  else if(nx)startRest(L.b.rest,'Recupero');
  else U.rest=null;
  U.keep=true;render();
}
function finish(){
  const c=S.cur,exs=[];
  Object.keys(c.ex).forEach(id=>{if(c.ex[id].length){const en={id:rx(id),name:EX[rx(id)].n,sets:c.ex[id]};if(c.notes&&c.notes[id])en.note=c.notes[id];exs.push(en);}});
  if(!exs.length){toast('Registra almeno una serie');return;}
  if(!confirm('Terminare e salvare l’allenamento?'))return;
  S.sessions.push({id:c.id,date:c.date,day:c.day,week:week(),minutes:Math.round((Date.now()-c.start)/60000),exercises:exs,mode:c.mode||'c',rec:c.rec||'ok',program:'v5'});
  S.cur=null;U.rest=null;U.ex=null;S.sel=null;save();toast('Allenamento salvato');render();
}
/* import / export */
function exportData(){
  const blob=new Blob([JSON.stringify({sessions:S.sessions,weights:S.weights,start:S.start,bio:S.bio,diet:S.diet,schema:S.schema,meta:S.meta,archive:S.archive,extracted:S.extracted,proposed:S.proposed,programs:S.programs,nutritionPlans:S.nutritionPlans,nutritionLog:S.nutritionLog,suggestions:S.suggestions,decisions:S.decisions},null,1)],{type:'application/json'});
  const f=new File([blob],'trackforza-backup-'+today()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Backup TrackForza'}).catch(()=>{});}
  else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
}
let pend=null;
function showImport(){
  modal('<h2>Importa dati</h2><div style="font-size:14px;color:var(--tx2);margin:8px 0 16px">Scegli il file JSON salvato dalla vecchia versione o da un backup. Le sedute si aggiungono a quelle già presenti.</div><div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn" id="pick">Scegli file</button><button class="btn ghost" id="loc">Cerca in questo telefono</button><button class="btn ghost" id="cl">Chiudi</button></div><div id="impst" class="small" style="margin-top:12px"></div>');
  document.getElementById('pick').onclick=()=>document.getElementById('file').click();
  document.getElementById('cl').onclick=closeModal;
  document.getElementById('loc').onclick=()=>{let f=null,k='';['tf_v3','tf_v2','tf_v1','trackforza'].forEach(x=>{if(!f){try{const d=localStorage.getItem(x);if(d){f=JSON.parse(d);k=x;}}catch(e){}}});if(!f)return stat('Nessun dato trovato in questo indirizzo. Se la vecchia app era su un altro indirizzo, usa il file JSON.');parse(f);};
}
function stat(t){const s=document.getElementById('impst');if(s)s.textContent=t;}
document.getElementById('file').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{parse(JSON.parse(r.result));}catch(e){showImport();stat('File non valido.');}};r.readAsText(f);ev.target.value='';});
function parse(p){
  let ss=Array.isArray(p)?p:(p.sessions||[]);ss=ss.filter(s=>s&&s.exercises&&s.date);
  const have=new Set(S.sessions.map(s=>s.id));const add=ss.filter(s=>!have.has(s.id)).map(s=>({id:s.id||Date.now()+Math.random(),date:s.date,day:s.day||'?',exercises:s.exercises.map(e=>({id:e.id||e.name,name:e.name,sets:(e.sets||[]).map(x=>({weight:x.weight||0,reps:x.reps||0}))}))}));
  let wAdd=[];if(p.weights&&p.weights.length)wAdd=p.weights.filter(w=>!S.weights.some(q=>q.date===w.date));
  if(!add.length&&!wAdd.length){showImport();stat('Nessuna seduta nuova da importare.');return;}
  pend={add:add,w:wAdd};
  modal('<h2>Conferma importazione</h2><div style="font-size:14px;color:var(--tx2);margin:8px 0 16px">'+add.length+' sedute'+(wAdd.length?' e '+wAdd.length+' pesate':'')+' nuove. I dati esistenti non vengono toccati.</div><div class="row" style="gap:10px"><button class="btn" id="ok">Importa</button><button class="btn ghost" id="no">Annulla</button></div>');
  document.getElementById('no').onclick=closeModal;
  document.getElementById('ok').onclick=()=>{S.sessions=S.sessions.concat(pend.add).sort((a,b)=>a.id-b.id);S.weights=S.weights.concat(pend.w);save();closeModal();toast(pend.add.length+' sedute importate');render();};
}
/* avvio */
load();save();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
